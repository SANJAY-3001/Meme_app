<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Meme App</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;800&display=swap" rel="stylesheet">
    </head>

    <body>

        <div class="container">

            <header>

                <div class="meme-header">
                    <img src="images/pumpkin.png" class="pumpkin-img">
                    <div class="meme-header-content">
                        <h3>Pumpkin's Purrfect</h3>
                        <h1>Meme Picker</h1>
                    </div>
                </div>
            </header>

            <main>

                <section>

                    <h2>
                        Select Your Current Emotion
                    </h2>

                    <div class="radio-emotions" id="radio-emotions">
                    </div>

                    <div class="gif-check">
                        <label for="gifs-only-option" class="gif-label">Animated GIFs only</label>
                        <input
                        type="checkbox"
                        id="gifs-only-option"
                        >
                    </div>

                    <div class="get-meme-image-btn">
                        <button class="get-image-btn" id="get-image-btn">Get Image</button>
                    </div>

                </section>

            </main>

            <!-- modal -->
            <div class="modal" id="modal">

                <div class="modal-close-btn-container">
                    <button class="modal-close-btn" id="modal-close-btn">X</button>
                </div>

                <div class="modal-inner" id="modal-inner">
                </div>

            </div>

        </div>
        
        <script type="module" src="scripts.js"></script>
    </body>

</html>
